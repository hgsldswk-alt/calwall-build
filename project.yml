name: CalWall
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.calwall
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  CalWall:
    type: application
    platform: iOS
    sources: [CalWall, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: CalWall AppStore
    info:
      path: CalWall/Info.plist
      properties:
        CFBundleDisplayName: Calendar Wallpaper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSCalendarsFullAccessUsageDescription: Shows your events on the wallpaper. Your calendar never leaves this iPhone.
        NSPhotoLibraryAddUsageDescription: Saves the wallpaper to your Photos.
  CalWallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalWallTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  CalWallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CalWallUITests]
    dependencies:
      - target: CalWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CalWall
schemes:
  CalWall:
    build:
      targets:
        CalWall: all
        CalWallTests: [test]
    test:
      config: Debug
      targets: [CalWallTests]
  CalWallUI:
    build:
      targets:
        CalWall: all
        CalWallUITests: [test]
    test:
      config: Debug
      targets: [CalWallUITests]
